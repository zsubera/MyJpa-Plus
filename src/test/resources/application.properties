spring.datasource.url=jdbc:mysql://localhost:3306/test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1351.zhong}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool: limit connections per @DataJpaTest context
# to prevent cumulative pools from exceeding MySQL max_connections=151
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.leak-detection-threshold=10000

# Spring TestContext failure threshold: stop retrying after 5 consecutive context load failures
spring.test.context.failure-threshold=5

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
