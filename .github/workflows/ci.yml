name: CI

on:
  push:
    branches: [main, master]
    tags: [v*]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven
      - name: Check code formatting
        run: mvn spotless:check --batch-mode --no-transfer-progress
      - name: Build and verify
        run: mvn clean verify --batch-mode --no-transfer-progress -Dgpg.skip=true -Ddependency-check.skip=true -DexcludedGroups=integration

  integration:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: maven
      - name: Run PostgreSQL + MySQL integration tests
        run: mvn test --batch-mode --no-transfer-progress -Dgpg.skip=true -Dgroups=integration

  release-deploy:
    needs: [build, integration]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: maven
      - uses: ./.github/actions/setup-maven-central
        with:
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-key-name: ${{ secrets.GPG_KEY_NAME }}
          central-username: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          central-password: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
      - name: Set release version from tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Releasing version $VERSION"
          mvn versions:set -DnewVersion="$VERSION"
      - name: Deploy RELEASE
        run: mvn deploy --batch-mode --no-transfer-progress -DskipTests -P central-release
